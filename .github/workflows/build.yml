name: Build ClansPlugin

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clear ALL Maven cache
        run: rm -rf ~/.m2/repository

      - name: Build with Maven
        run: mvn package -f Clansystem/pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ClansPlugin
          path: Clansystem/target/ClansPlugin-1.0.0.jar
