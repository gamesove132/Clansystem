name: ClansPlugin
version: 1.0.0
main: com.clans.ClansPlugin
api-version: 1.20
author: YourName
description: Clan system with per-world support, economy, PlaceholderAPI

softdepend:
  - Vault
  - PlaceholderAPI

commands:
  clans:
    description: Clan system main command
    usage: /clans <subcommand>
    aliases: [cc]
  cc:
    description: Clan system shortcut
    usage: /cc <subcommand>

permissions:
  clans.use:
    description: Use clan commands
    default: true
  clans.admin:
    description: Admin access (reload, etc)
    default: op
