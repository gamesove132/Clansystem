# ===========================
# Налаштування кланів
# ===========================

# Колір назви клану (& коди)
clan-color: "&6"

# Вартість створення клану (0 = безкоштовно)
create-cost: 3000.0

# Час запрошення (секунди) до автоскасування
invite-expiry-seconds: 60

# Мінімальна/максимальна довжина назви
name-min-length: 2
name-max-length: 16

# Максимум гравців у клані (0 = без ліміту)
max-members: 0

# Плейсхолдер скорборду коли гравець без клану
scoreboard:
  no-clan-text: "&7Без клану"
  clan-format: "&8[{color}{clan}&8]"

# ===========================
# Повідомлення (підтримують & кольори)
# ===========================
messages:
  # Створення
  clan-created: "&a[Клани] Клан &6{clan} &aуспішно створено!"
  clan-exists: "&c[Клани] Клан з такою назвою вже існує!"
  already-in-clan: "&c[Клани] Ви вже в клані! Спочатку вийдіть: /clans leave"
  not-enough-money: "&c[Клани] Недостатньо грошей! Потрібно: &e{cost} {currency}"
  name-length: "&c[Клани] Назва клану має бути від 2 до 16 символів!"
  name-invalid: "&c[Клани] Назва може містити лише літери, цифри та _"

  # Запрошення
  invite-sent: "&a[Клани] Запрошення надіслано гравцю &f{player}&a!"
  invite-received: "&7[&6Клани&7] &f{inviter} &7запрошує вас у клан &6{clan}&7!"
  invite-expired: "&c[Клани] Запрошення в клан &6{clan} &cзакінчилось!"
  invite-denied: "&7[Клани] Ви відхилили запрошення."
  no-invite: "&c[Клани] У вас немає активних запрошень!"
  already-invited: "&c[Клани] Цей гравець вже має запрошення!"
  already-in-clan-other: "&c[Клани] Гравець {player} вже є в клані!"
  cant-invite-yourself: "&c[Клани] Не можна запрошувати себе!"

  # Вхід/вихід
  joined-clan: "&a[Клани] Ви приєднались до клану &6{clan}&a!"
  member-joined: "&a[Клани] &f{player} &aприєднався до клану &6{clan}&a!"
  left-clan: "&7[Клани] Ви вийшли з клану &6{clan}&7."
  member-left: "&7[Клани] &f{player} &7вийшов з клану &6{clan}&7."
  owner-cant-leave: "&c[Клани] Власник не може вийти! Спочатку розпустіть клан: /clans disband"
  not-in-clan: "&c[Клани] Ви не перебуваєте в жодному клані!"
  clan-not-found: "&c[Клани] Клан не знайдено!"

  # Розпуск
  clan-disbanded: "&c[Клани] Клан &6{clan} &cрозпущено власником!"

  # Перейменування
  clan-renamed: "&6[Клани] Клан перейменовано: &f{old} &6→ &f{new}"
  usage-rename: "&c Використання: /clans rename <нова назва>"

  # Кік
  member-kicked: "&c[Клани] &f{player} &cвиключений з клану &6{clan}&c!"
  you-were-kicked: "&c[Клани] Вас виключили з клану &6{clan}&c!"
  kicked-player: "&a[Клани] Гравця &f{player} &aвиключено!"
  cant-kick-yourself: "&c[Клани] Не можна виключити себе!"
  not-in-your-clan: "&c[Клани] Цей гравець не є членом вашого клану!"

  # Глобальний чат клану
  global-format: "&8[&6Клан {clan}&8] &f{player}&7: &f{message}"
  usage-global: "&c Використання: /clans global <повідомлення>"

  # Смерть
  death-prefix: "&8[&6Клан&8] "

  # Інші
  not-owner: "&c[Клани] Тільки власник клану може це зробити!"
  no-permission: "&c[Клани] У вас немає дозволу!"
  reloaded: "&a[Клани] Конфіг перезавантажено!"
  player-offline: "&c[Клани] Гравець не знайдений або офлайн!"
  usage-create: "&c Використання: /clans create <назва>"
  usage-invite: "&c Використання: /clans invite <гравець>"
  usage-kick: "&c Використання: /clans kick <гравець>"

  # Ролі для PlaceholderAPI
  role-owner: "&6Власник"
  role-member: "&7Учасник"
  no-clan-placeholder: "&7Без клану"
